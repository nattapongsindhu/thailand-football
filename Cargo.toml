[package]
name = "thailand-football"
version = "0.1.0"
edition = "2024"
description = "Thailand Football — Rust/Axum/Askama/SQLx local preview"
default-run = "thailand-football"

[[bin]]
name = "update-football-data"
path = "src/bin/update_football_data.rs"

[[bin]]
name = "import-team-registry"
path = "src/bin/import_team_registry.rs"

[dependencies]
anyhow = "1.0.100"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["form", "query"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "gzip",
    "brotli",
    "charset",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "migrate",
    "macros",
    "derive",
    "chrono",
    "json",
] }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
    "compression-gzip",
    "fs",
    "set-header",
    "trace",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
