<header class="topbar">
  <button class="icon-button mobile-menu" type="button" data-sidebar-toggle aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="topbar-context">
    <span class="topbar-kicker">Thailand</span>
    <span class="topbar-title">Football data</span>
  </div>

  <div class="topbar-actions">
    <div class="search-shell">
      <form class="search-form" action="/search" method="get" role="search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 4 4" stroke-linecap="round"></path>
        </svg>
        <input
          id="global-search"
          class="search-input"
          type="search"
          name="q"
          value="{{ search_query }}"
          placeholder="Search teams"
          autocomplete="off"
          aria-label="Search teams"
          hx-get="/search"
          hx-trigger="input changed delay:200ms, search"
          hx-target="#search-results"
          hx-swap="innerHTML"
          hx-push-url="false">
        <button class="search-submit" type="submit" aria-label="Search">
          <span aria-hidden="true">↵</span>
        </button>
      </form>
      <div id="search-results" class="search-results" aria-live="polite"></div>
    </div>

    <span class="mode-badge {% if is_preview %}mode-preview{% endif %}">{{ mode_label }}</span>

    <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark theme" aria-pressed="false">
      <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
      </svg>
      <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M20 15.4A8.5 8.5 0 0 1 8.6 4a8.5 8.5 0 1 0 11.4 11.4Z" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>
